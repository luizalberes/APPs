<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Câmera</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
  }
  main {
    width: min(92vw, 420px);
    text-align: center;
  }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: #bbb; margin: 0 0 24px; line-height: 1.45; }
  button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 16px;
    margin-top: 10px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
  }
  #start { background: #fff; color: #000; }
  #stop { background: #333; color: #fff; display: none; }
  #status {
    margin-top: 18px;
    min-height: 24px;
    font-size: 14px;
    color: #aaa;
  }
  .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #777;
    margin-right: 7px;
  }
  .dot.active { background: #36d66b; }
  /* O vídeo existe apenas para receber os frames da câmera.
     Ele permanece fora da área visível. */
  #cameraFeed {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    left: -10px;
    top: -10px;
  }
</style>
</head>
<body>
<main>
  <h1>Câmera</h1>
  <p>A tela permanece preta enquanto a câmera autorizada está ativa.</p>

  <button id="start">Ativar câmera</button>
  <button id="stop">Desligar câmera</button>

  <div id="status"><span class="dot"></span>Câmera desligada</div>
</main>

<video id="cameraFeed" autoplay playsinline muted></video>
<canvas id="processor" width="1" height="1" hidden></canvas>

<script>
const video = document.getElementById("cameraFeed");
const canvas = document.getElementById("processor");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const status = document.getElementById("status");

let stream = null;
let processing = false;

function setStatus(active, text) {
  status.innerHTML =
    `<span class="dot ${active ? "active" : ""}"></span>${text}`;
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus(false, "Este navegador não permite acesso à câmera.");
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    startBtn.style.display = "none";
    stopBtn.style.display = "block";
    setStatus(true, "Câmera ativa");

    processing = true;
    processFrames();
  } catch (error) {
    console.error(error);
    setStatus(false, "Acesso à câmera não autorizado ou indisponível.");
  }
}

function processFrames() {
  if (!processing || !stream) return;

  // Os frames podem ser processados aqui sem serem exibidos na tela.
  // Exemplo: copiar um frame para o canvas para futuras análises.
  if (video.readyState >= 2) {
    canvas.width = video.videoWidth || 1;
    canvas.height = video.videoHeight || 1;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  }

  requestAnimationFrame(processFrames);
}

function stopCamera() {
  processing = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  startBtn.style.display = "block";
  stopBtn.style.display = "none";
  setStatus(false, "Câmera desligada");
}

startBtn.addEventListener("click", startCamera);
stopBtn.addEventListener("click", stopCamera);

window.addEventListener("pagehide", stopCamera);
</script>
</body>
</html>
