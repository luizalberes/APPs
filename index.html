<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Câmera</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
}

body { min-height: 100svh; }

#screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000 url("lockscreen.png") center center / cover no-repeat;
}

#dynamicArea {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 31%;
  background: rgba(0,0,0,.88);
}

#date {
  position: absolute;
  top: max(9vh, 70px);
  left: 0;
  width: 100%;
  text-align: center;
  font-size: clamp(17px,4.5vw,23px);
  font-weight: 400;
}

#clock {
  position: absolute;
  top: max(12vh,95px);
  left: 0;
  width: 100%;
  text-align: center;
  font-size: clamp(74px,23vw,128px);
  line-height: 1;
  font-weight: 300;
  letter-spacing: -5px;
  font-variant-numeric: tabular-nums;
}

#controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: max(5vh, 45px);
  height: 95px;
}

.control {
  position: absolute;
  bottom: 0;
  width: 74px;
  height: 74px;
  border: 0;
  border-radius: 50%;
  background: rgba(20,20,20,.72);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 11px;
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
  padding: 0;
}

#cameraToggle { left: max(7vw, 28px); }
#recordToggle { right: max(7vw, 28px); }

.icon-img {
  width: 31px;
  height: 31px;
  object-fit: contain;
  display: block;
  margin-bottom: 3px;
}

#cameraToggle.active {
  background: rgba(190, 190, 190, 0.85);
}

#cameraToggle.active .icon-img {
  filter: none;
}

#recordToggle.recording {
  background: rgba(190, 190, 190, 0.85);
}

#recordToggle.active .icon-img {
  filter: none;
}

#recordToggle:disabled,
#cameraToggle:disabled {
  opacity: .45;
}

/* BOTÃO DE TROCA DE CÂMERA */
#cameraSwitch {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 154px;
  width: 160px;
  height: 50px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: rgba(20,20,20,.72);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
}

#cameraSwitch:disabled {
  opacity: .45;
}

#state {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 104px;
  white-space: nowrap;
  padding: 7px 13px;
  border-radius: 999px;
  background: rgba(0,0,0,.48);
  font-size: 13px;
  color: rgba(255,255,255,.9);
}

#statusDot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #777;
  margin-right: 6px;
}

#statusDot.active { background: #35d66b; }
#statusDot.recording { background: #ff3333; }

#cameraFeed {
  position: fixed;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
  left: -10px;
  top: -10px;
}

#processor { display:none; }
</style>
</head>

<body>

<div id="screen">

  <div id="dynamicArea"></div>

  <div id="date"></div>

  <div id="clock">00:00</div>

  <!-- BOTÃO DE TROCA DE CÂMERA -->
  <button id="cameraSwitch" disabled>Traseira</button>

  <div id="state">
    <span id="statusDot"></span>
    <span id="stateText">Deslize para desbloquear</span>
  </div>

  <div id="controls">

    <button class="control" id="cameraToggle" aria-label="Ativar ou desativar câmera">
      <img class="icon-img" src="lanterna.svg" alt="Lanterna">
      <span id="cameraLabel">Lanterna</span>
    </button>

    <button class="control" id="recordToggle" aria-label="Iniciar ou parar gravação" disabled>
      <img class="icon-img" src="camera.svg" alt="Câmera">
      <span id="recordLabel">Câmera</span>
    </button>

  </div>

</div>

<video id="cameraFeed" autoplay playsinline muted></video>

<canvas id="processor" width="1" height="1"></canvas>

<script>

const video = document.getElementById("cameraFeed");
const canvas = document.getElementById("processor");

const cameraToggle = document.getElementById("cameraToggle");
const recordToggle = document.getElementById("recordToggle");
const cameraSwitch = document.getElementById("cameraSwitch");

const cameraLabel = document.getElementById("cameraLabel");
const recordLabel = document.getElementById("recordLabel");

const statusDot = document.getElementById("statusDot");
const stateText = document.getElementById("stateText");

const clock = document.getElementById("clock");
const date = document.getElementById("date");

let stream = null;
let recorder = null;
let recordedChunks = [];
let recording = false;

/* Câmera inicial: traseira */
let facingMode = "environment";


function updateClock() {

  const now = new Date();

  clock.textContent = now.toLocaleTimeString("pt-BR", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  date.textContent = now.toLocaleDateString("pt-BR", {
    weekday: "long",
    day: "numeric",
    month: "long"
  }).replace(/^./, c => c.toUpperCase());

}

updateClock();

setInterval(updateClock, 1000);


function setState(active, text, isRecording=false) {

  statusDot.classList.toggle(
    "active",
    active && !isRecording
  );

  statusDot.classList.toggle(
    "recording",
    isRecording
  );

  stateText.textContent = text;

}


async function startCamera() {

  if (!navigator.mediaDevices?.getUserMedia) {

    setState(false, "Câmera não disponível");

    return;

  }

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: {
          ideal: facingMode
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      },

      audio: false

    });


    video.srcObject = stream;

    await video.play();


    cameraToggle.classList.add("active");

    cameraLabel.textContent = "Lanterna";


    recordToggle.disabled = false;

    cameraSwitch.disabled = false;


    /* Atualiza os nomes conforme a câmera */
    const cameraName =
      facingMode === "user"
        ? "Frontal"
        : "Traseira";


    cameraSwitch.textContent = cameraName;

    recordLabel.textContent = cameraName;


    setState(
      true,
      "Deslize para desbloquear"
    );


    processFrames();

  }

  catch (error) {

    console.error(error);

    setState(
      false,
      "Acesso à câmera não autorizado"
    );

  }

}


function processFrames() {

  if (!stream) return;


  if (video.readyState >= 2) {

    canvas.width = video.videoWidth || 1;

    canvas.height = video.videoHeight || 1;


    const ctx = canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  requestAnimationFrame(processFrames);

}


function stopCamera() {

  if (recording) {
    stopRecording();
  }


  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;

  }


  video.srcObject = null;


  cameraToggle.classList.remove("active");

  cameraLabel.textContent = "Lanterna";


  recordToggle.disabled = true;

  cameraSwitch.disabled = true;


  setState(
    false,
    "Deslize para desbloquear"
  );

}


function getRecorderMimeType() {

  const types = [

    "video/mp4",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  return types.find(
    t => MediaRecorder.isTypeSupported(t)
  ) || "";

}


function startRecording() {

  if (!stream || !window.MediaRecorder) {

    setState(
      true,
      "Gravação não disponível neste navegador"
    );

    return;

  }


  recordedChunks = [];


  const mimeType = getRecorderMimeType();


  try {

    recorder = mimeType

      ? new MediaRecorder(
          stream,
          {
            mimeType
          }
        )

      : new MediaRecorder(stream);

  }

  catch (e) {

    recorder = new MediaRecorder(stream);

  }


  recorder.ondataavailable = e => {

    if (
      e.data &&
      e.data.size > 0
    ) {

      recordedChunks.push(e.data);

    }

  };


  recorder.onstop = saveRecording;


  recorder.start();


  recording = true;


  recordToggle.classList.add(
    "recording"
  );


  recordLabel.textContent =
    facingMode === "user"
      ? "Frontal"
      : "Traseira";


  setState(
    true,
    "Deslize para desbloquear",
    true
  );

}


function stopRecording() {

  if (
    !recorder ||
    recorder.state === "inactive"
  ) {
    return;
  }


  recorder.stop();


  recording = false;


  recordToggle.classList.remove(
    "recording"
  );


  recordLabel.textContent =
    facingMode === "user"
      ? "Frontal"
      : "Traseira";


  setState(
    !!stream,
    "Deslize para desbloquear"
  );

}


function saveRecording() {

  if (!recordedChunks.length) {
    return;
  }


  const type =
    recorder?.mimeType ||
    "video/mp4";


  const blob =
    new Blob(
      recordedChunks,
      {
        type
      }
    );


  const ext =
    type.includes("mp4")
      ? "mp4"
      : "webm";


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;


  a.download =
    `video-${new Date()
      .toISOString()
      .replace(/[:.]/g,"-")}.${ext}`;


  document.body.appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );

}


/* TROCA ENTRE CÂMERA FRONTAL E TRASEIRA */

async function switchCamera() {

  if (!stream) {
    return;
  }


  /* Se estiver gravando, encerra a gravação antes da troca */
  if (recording) {
    stopRecording();
  }


  /* Desliga a câmera atual */

  stream
    .getTracks()
    .forEach(track => track.stop());


  stream = null;

  video.srcObject = null;


  /* Alterna a câmera */

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";


  /* Liga a nova câmera */

  await startCamera();

}


/* BOTÃO LIGA/DESLIGA CÂMERA */

cameraToggle.addEventListener(
  "click",
  () => {

    if (stream) {
      stopCamera();
    }

    else {
      startCamera();
    }

  }
);


/* BOTÃO DE GRAVAÇÃO */

recordToggle.addEventListener(
  "click",
  () => {

    if (recording) {
      stopRecording();
    }

    else {
      startRecording();
    }

  }
);


/* BOTÃO DE TROCA DE CÂMERA */

cameraSwitch.addEventListener(
  "click",
  switchCamera
);


/* Ao sair da página */

window.addEventListener(
  "pagehide",
  stopCamera
);

</script>

</body>
</html>
