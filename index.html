<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Câmera</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
}

body {
  min-height: 100svh;
}

#screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000 url("lockscreen.png") center center / cover no-repeat;
  transition: background .2s ease;
}

/* =========================
   MODO PRETO
   ========================= */

#screen.black-mode {
  background: #000;
}

#dynamicArea {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 31%;
  background: rgba(0,0,0,.88);
  transition: opacity .2s ease;
}

#date {
  position: absolute;
  top: max(9vh, 70px);
  left: 0;
  width: 100%;
  text-align: center;
  font-size: clamp(17px,4.5vw,23px);
  font-weight: 400;
  transition: opacity .2s ease;
}

#clock {
  position: absolute;
  top: max(12vh,95px);
  left: 0;
  width: 100%;
  text-align: center;
  font-size: clamp(74px,23vw,128px);
  line-height: 1;
  font-weight: 300;
  letter-spacing: -5px;
  font-variant-numeric: tabular-nums;
  transition: opacity .2s ease;
}

/* No modo preto, somente data/hora e background são alterados */
#screen.black-mode #dynamicArea,
#screen.black-mode #date,
#screen.black-mode #clock {
  opacity: 0;
}

/* =========================
   CONTROLES
   ========================= */

#controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: max(5vh, 45px);
  height: 95px;
  z-index: 10;
}

.control {
  position: absolute;
  bottom: 0;
  width: 74px;
  height: 74px;
  border: 0;
  border-radius: 50%;
  background: rgba(20,20,20,.72);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 11px;
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
  padding: 0;
}

#cameraToggle {
  left: max(7vw, 28px);
}

#recordToggle {
  right: max(7vw, 28px);
}

.icon-img {
  width: 31px;
  height: 31px;
  object-fit: contain;
  display: block;
  margin-bottom: 3px;
}

#cameraToggle.active {
  background: rgba(190, 190, 190, 0.85);
}

#cameraToggle.active .icon-img {
  filter: none;
}

#recordToggle.recording {
  background: rgba(190, 190, 190, 0.85);
}

#recordToggle.active .icon-img {
  filter: none;
}

#recordToggle:disabled,
#cameraToggle:disabled {
  opacity: .45;
}

/* =========================
   BOTÃO DE TROCA DE CÂMERA
   ========================= */

#cameraSwitch {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 154px;
  width: 160px;
  height: 50px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: rgba(20,20,20,.72);
  color: transparent;
  font-size: 0;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
  z-index: 20;
}

#cameraSwitch:disabled {
  opacity: .45;
}

/* =========================
   ESTADO
   ========================= */

#state {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 104px;
  white-space: nowrap;
  padding: 7px 13px;
  border-radius: 999px;
  background: rgba(0,0,0,.48);
  font-size: 13px;
  color: rgba(255,255,255,.9);
  z-index: 30;
}

/* Mantém o indicador visível no modo preto */
#screen.black-mode #state {
  background: rgba(0,0,0,.9);
}

#statusDot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #777;
  margin-right: 6px;
}

#statusDot.active {
  background: #35d66b;
}

#statusDot.recording {
  background: #ff3333;
}

/* =========================
   BOTÃO DE ALTERAÇÃO DO MODO
   ========================= */

#modeSwitch {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 47px;
  width: 160px;
  height: 50px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: rgba(20,20,20,.72);
  color: transparent;
  font-size: 0;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
  z-index: 20;
}

/* =========================
   CÂMERA
   ========================= */

#cameraFeed {
  position: fixed;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
  left: -10px;
  top: -10px;
}

#processor {
  display: none;
}
</style>
</head>

<body>

<div id="screen">

  <div id="dynamicArea"></div>

  <div id="date"></div>

  <div id="clock">00:00</div>


  <!-- BOTÃO DE TROCA DE CÂMERA -->
  <button
    id="cameraSwitch"
    disabled
    aria-label="Alternar câmera">
  </button>


  <!-- INDICADOR DE ESTADO -->
  <div id="state">
    <span id="statusDot"></span>
    <span id="stateText">Deslize para desbloquear</span>
  </div>


  <!-- BOTÃO DE TROCA DO MODO DA TELA -->
  <button
    id="modeSwitch"
    aria-label="Alternar modo da tela">
  </button>


  <!-- CONTROLES INFERIORES -->
  <div id="controls">

    <button
      class="control"
      id="cameraToggle"
      aria-label="Ativar ou desativar câmera">

      <img
        class="icon-img"
        src="lanterna.svg"
        alt="Lanterna">

      <span id="cameraLabel">Lanterna</span>

    </button>


    <button
      class="control"
      id="recordToggle"
      aria-label="Iniciar ou parar gravação"
      disabled>

      <img
        class="icon-img"
        src="camera.svg"
        alt="Câmera">

      <span id="recordLabel">Câmera</span>

    </button>

  </div>

</div>


<video
  id="cameraFeed"
  autoplay
  playsinline
  muted>
</video>


<canvas
  id="processor"
  width="1280"
  height="720">
</canvas>


<script>

/* =========================
   ELEMENTOS
   ========================= */

const video =
  document.getElementById("cameraFeed");

const canvas =
  document.getElementById("processor");

const cameraToggle =
  document.getElementById("cameraToggle");

const recordToggle =
  document.getElementById("recordToggle");

const cameraSwitch =
  document.getElementById("cameraSwitch");

const modeSwitch =
  document.getElementById("modeSwitch");

const cameraLabel =
  document.getElementById("cameraLabel");

const recordLabel =
  document.getElementById("recordLabel");

const statusDot =
  document.getElementById("statusDot");

const stateText =
  document.getElementById("stateText");

const clock =
  document.getElementById("clock");

const date =
  document.getElementById("date");

const screen =
  document.getElementById("screen");


/* =========================
   VARIÁVEIS
   ========================= */

let stream = null;

let recorder = null;

let recordedChunks = [];

let recording = false;

let recordingStream = null;

let facingMode = "environment";

let frameLoopRunning = false;

let blackMode = false;


/* =========================
   RELÓGIO
   ========================= */

function updateClock() {

  const now = new Date();

  clock.textContent =
    now.toLocaleTimeString(
      "pt-BR",
      {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    );

  date.textContent =
    now.toLocaleDateString(
      "pt-BR",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    ).replace(
      /^./,
      c => c.toUpperCase()
    );

}

updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================
   ESTADO
   ========================= */

function setState(
  active,
  text,
  isRecording = false
) {

  statusDot.classList.toggle(
    "active",
    active && !isRecording
  );

  statusDot.classList.toggle(
    "recording",
    isRecording
  );

  stateText.textContent =
    text;

}


/* =========================
   NOME DA CÂMERA
   ========================= */

function getCameraName() {

  return facingMode === "user"
    ? "Frontal"
    : "Traseira";

}


/* =========================
   INICIA CÂMERA
   ========================= */

async function startCamera() {

  if (
    !navigator.mediaDevices?.getUserMedia
  ) {

    setState(
      false,
      "Câmera não disponível"
    );

    return false;

  }


  try {

    const newStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: facingMode
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    stream =
      newStream;


    video.srcObject =
      stream;


    await video.play();


    cameraToggle.classList.add(
      "active"
    );


    cameraLabel.textContent =
      "Lanterna";


    recordToggle.disabled =
      false;


    cameraSwitch.disabled =
      false;


    recordLabel.textContent =
      getCameraName();


    setState(
      true,
      "Deslize para desbloquear",
      recording
    );


    startFrameProcessing();


    return true;

  }

  catch (error) {

    console.error(error);


    setState(
      false,
      "Acesso à câmera não autorizado"
    );


    return false;

  }

}


/* =========================
   PROCESSAMENTO DO VÍDEO
   ========================= */

function startFrameProcessing() {

  if (frameLoopRunning) {
    return;
  }


  frameLoopRunning =
    true;


  processFrames();

}


function processFrames() {

  if (!stream) {

    frameLoopRunning =
      false;

    return;

  }


  if (video.readyState >= 2) {

    const width =
      video.videoWidth || 1280;

    const height =
      video.videoHeight || 720;


    if (
      canvas.width !== width ||
      canvas.height !== height
    ) {

      canvas.width =
        width;

      canvas.height =
        height;

    }


    const ctx =
      canvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  requestAnimationFrame(
    processFrames
  );

}


/* =========================
   DESLIGA CÂMERA
   ========================= */

function stopCamera() {

  if (recording) {
    stopRecording();
  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    stream = null;

  }


  video.srcObject =
    null;


  cameraToggle.classList.remove(
    "active"
  );


  cameraLabel.textContent =
    "Lanterna";


  recordToggle.disabled =
    true;


  cameraSwitch.disabled =
    true;


  recordLabel.textContent =
    "Câmera";


  setState(
    false,
    "Deslize para desbloquear"
  );

}


/* =========================
   FORMATO DA GRAVAÇÃO
   ========================= */

function getRecorderMimeType() {

  const types = [

    "video/mp4",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  return types.find(
    type =>
      MediaRecorder.isTypeSupported(
        type
      )
  ) || "";

}


/* =========================
   INICIA GRAVAÇÃO
   ========================= */

function startRecording() {

  if (
    !stream ||
    !window.MediaRecorder
  ) {

    setState(
      true,
      "Gravação não disponível neste navegador"
    );

    return;

  }


  recordedChunks = [];


  try {

    if (
      !recordingStream ||
      recordingStream
        .getTracks()
        .length === 0
    ) {

      recordingStream =
        canvas.captureStream(30);

    }

  }

  catch (error) {

    console.error(error);


    setState(
      true,
      "Gravação não disponível neste navegador"
    );


    return;

  }


  const mimeType =
    getRecorderMimeType();


  try {

    recorder =
      mimeType

        ? new MediaRecorder(
            recordingStream,
            {
              mimeType
            }
          )

        : new MediaRecorder(
            recordingStream
          );

  }

  catch (error) {

    console.error(error);


    try {

      recorder =
        new MediaRecorder(
          recordingStream
        );

    }

    catch (finalError) {

      console.error(finalError);


      setState(
        true,
        "Gravação não disponível neste navegador"
      );


      return;

    }

  }


  recorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );

      }

    };


  recorder.onstop =
    saveRecording;


  recorder.start();


  recording =
    true;


  recordToggle.classList.add(
    "recording"
  );


  recordLabel.textContent =
    getCameraName();


  setState(
    true,
    "Deslize para desbloquear",
    true
  );

}


/* =========================
   PARA GRAVAÇÃO
   ========================= */

function stopRecording() {

  if (
    !recorder ||
    recorder.state === "inactive"
  ) {

    return;

  }


  recorder.stop();


  recording =
    false;


  recordToggle.classList.remove(
    "recording"
  );


  recordLabel.textContent =
    getCameraName();


  setState(
    !!stream,
    "Deslize para desbloquear"
  );

}


/* =========================
   SALVA GRAVAÇÃO
   ========================= */

function saveRecording() {

  if (!recordedChunks.length) {
    return;
  }


  const type =
    recorder?.mimeType ||
    "video/mp4";


  const blob =
    new Blob(
      recordedChunks,
      {
        type
      }
    );


  const ext =
    type.includes("mp4")
      ? "mp4"
      : "webm";


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    `video-${new Date()
      .toISOString()
      .replace(
        /[:.]/g,
        "-"
      )}.${ext}`;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );

}


/* =========================
   TROCA DE CÂMERA
   ========================= */

async function switchCamera() {

  if (!stream) {
    return;
  }


  const wasRecording =
    recording;


  const oldStream =
    stream;


  const newFacingMode =
    facingMode === "environment"
      ? "user"
      : "environment";


  try {

    const newStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              exact: newFacingMode
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    facingMode =
      newFacingMode;


    stream =
      newStream;


    video.srcObject =
      newStream;


    await video.play();


    oldStream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    recordLabel.textContent =
      getCameraName();


    setState(
      true,
      "Deslize para desbloquear",
      wasRecording
    );


    startFrameProcessing();

  }

  catch (error) {

    console.error(error);


    setState(
      true,
      "Não foi possível trocar a câmera",
      wasRecording
    );

  }

}


/* =========================
   ALTERNA MODO DA TELA
   ========================= */

function toggleScreenMode() {

  blackMode =
    !blackMode;


  screen.classList.toggle(
    "black-mode",
    blackMode
  );

}


/* =========================
   BOTÃO LIGA/DESLIGA CÂMERA
   ========================= */

cameraToggle.addEventListener(
  "click",
  () => {

    if (stream) {

      stopCamera();

    }

    else {

      startCamera();

    }

  }
);


/* =========================
   BOTÃO DE GRAVAÇÃO
   ========================= */

recordToggle.addEventListener(
  "click",
  () => {

    if (recording) {

      stopRecording();

    }

    else {

      startRecording();

    }

  }
);


/* =========================
   BOTÃO DE TROCA DE CÂMERA
   ========================= */

cameraSwitch.addEventListener(
  "click",
  switchCamera
);


/* =========================
   BOTÃO DE MODO DA TELA
   ========================= */

modeSwitch.addEventListener(
  "click",
  toggleScreenMode
);


/* =========================
   AO SAIR DA PÁGINA
   ========================= */

window.addEventListener(
  "pagehide",
  stopCamera
);

</script>

</body>
</html>
